<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#5b7a89"/></marker></defs><rect width="1100" height="600" fill="#f6f8fa"/><text x="45" y="50" font-family="sans-serif" font-size="27" font-weight="700" fill="#172f40">Arquitetura da aplicação</text><text x="45" y="80" font-family="sans-serif" font-size="14" fill="#637c8c">O mesmo CSV canônico abastece as duas bases, e o dashboard consulta uma fonte por operação</text><rect x="45" y="190" width="250" height="124" rx="7" fill="white" stroke="#cbd6dc"/><path d="M52,190 H288 Q295,190 295,197 V237 H45 V197 Q45,190 52,190" fill="#173d4b"/><text x="63" y="220" font-family="sans-serif" font-size="19" font-weight="700" fill="white">Dashboard web</text><text x="63" y="266" font-family="sans-serif" font-size="16" fill="#29434d">Indicadores e filtros</text><text x="63" y="296" font-family="sans-serif" font-size="16" fill="#29434d">Comparação de tempos</text><rect x="425" y="190" width="245" height="154" rx="7" fill="white" stroke="#cbd6dc"/><path d="M432,190 H663 Q670,190 670,197 V237 H425 V197 Q425,190 432,190" fill="#173d4b"/><text x="443" y="220" font-family="sans-serif" font-size="19" font-weight="700" fill="white">API FastAPI</text><text x="443" y="266" font-family="sans-serif" font-size="16" fill="#29434d">Validação e contratos</text><text x="443" y="296" font-family="sans-serif" font-size="16" fill="#29434d">Medição do cliente</text><text x="443" y="326" font-family="sans-serif" font-size="16" fill="#29434d">CRUD por fonte</text><rect x="805" y="125" width="250" height="124" rx="7" fill="white" stroke="#cbd6dc"/><path d="M812,125 H1048 Q1055,125 1055,132 V172 H805 V132 Q805,125 812,125" fill="#173d4b"/><text x="823" y="155" font-family="sans-serif" font-size="19" font-weight="700" fill="white">PostgreSQL</text><text x="823" y="201" font-family="sans-serif" font-size="16" fill="#29434d">Tabelas e índices</text><text x="823" y="231" font-family="sans-serif" font-size="16" fill="#29434d">WAL e restrições</text><rect x="805" y="350" width="250" height="124" rx="7" fill="white" stroke="#cbd6dc"/><path d="M812,350 H1048 Q1055,350 1055,357 V397 H805 V357 Q805,350 812,350" fill="#173d4b"/><text x="823" y="380" font-family="sans-serif" font-size="19" font-weight="700" fill="white">Redis</text><text x="823" y="426" font-family="sans-serif" font-size="16" fill="#29434d">Hashes e sorted sets</text><text x="823" y="456" font-family="sans-serif" font-size="16" fill="#29434d">AOF everysec e Lua</text><path d="M295 250 H425" fill="none" stroke="#5b7a89" stroke-width="2" marker-end="url(#arrow)"/><text x="310" y="235" font-family="sans-serif" font-size="15" fill="#58717d">HTTP / JSON</text><path d="M670 250 H740 V185 H805" fill="none" stroke="#5b7a89" stroke-width="2" marker-end="url(#arrow)"/><text x="750" y="170" font-family="sans-serif" font-size="15" fill="#58717d">SQL</text><path d="M670 290 H740 V410 H805" fill="none" stroke="#5b7a89" stroke-width="2" marker-end="url(#arrow)"/><text x="750" y="395" font-family="sans-serif" font-size="15" fill="#58717d">RESP</text><text x="45" y="555" font-family="sans-serif" font-size="16" fill="#29434d">Scripts locais: geração, carga, verificação de 100% da massa, CRUD e benchmark com ordem alternada.</text></svg>