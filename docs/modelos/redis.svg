<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#5b7a89"/></marker></defs><rect width="1100" height="600" fill="#f6f8fa"/><text x="45" y="50" font-family="sans-serif" font-size="27" font-weight="700" fill="#172f40">Modelo chave-valor</text><text x="45" y="80" font-family="sans-serif" font-size="14" fill="#637c8c">Redis: hashes de objetos, índice temporal por sensor e unicidade mantida por Lua</text><rect x="45" y="130" width="310" height="94" rx="7" fill="white" stroke="#cbd6dc"/><path d="M52,130 H348 Q355,130 355,137 V177 H45 V137 Q45,130 52,130" fill="#173d4b"/><text x="63" y="160" font-family="sans-serif" font-size="19" font-weight="700" fill="white">iot:sensor:501 / hash</text><text x="63" y="206" font-family="sans-serif" font-size="16" fill="#29434d">id, name, location, active</text><rect x="45" y="330" width="310" height="94" rx="7" fill="white" stroke="#cbd6dc"/><path d="M52,330 H348 Q355,330 355,337 V377 H45 V337 Q45,330 52,330" fill="#173d4b"/><text x="63" y="360" font-family="sans-serif" font-size="19" font-weight="700" fill="white">iot:sensors / set</text><text x="63" y="406" font-family="sans-serif" font-size="16" fill="#29434d">IDs dos 1.000 sensores</text><rect x="420" y="130" width="310" height="154" rx="7" fill="white" stroke="#cbd6dc"/><path d="M427,130 H723 Q730,130 730,137 V177 H420 V137 Q420,130 427,130" fill="#173d4b"/><text x="438" y="160" font-family="sans-serif" font-size="19" font-weight="700" fill="white">Índice temporal / sorted set</text><text x="438" y="206" font-family="sans-serif" font-size="16" fill="#29434d">iot:sensor:501:readings</text><text x="438" y="236" font-family="sans-serif" font-size="16" fill="#29434d">score = instante UTC</text><text x="438" y="266" font-family="sans-serif" font-size="16" fill="#29434d">member = ID da leitura</text><rect x="420" y="350" width="310" height="124" rx="7" fill="white" stroke="#cbd6dc"/><path d="M427,350 H723 Q730,350 730,357 V397 H420 V357 Q420,350 427,350" fill="#173d4b"/><text x="438" y="380" font-family="sans-serif" font-size="19" font-weight="700" fill="white">Unicidade / hash</text><text x="438" y="426" font-family="sans-serif" font-size="16" fill="#29434d">iot:unique:501</text><text x="438" y="456" font-family="sans-serif" font-size="16" fill="#29434d">instante = ID da leitura</text><rect x="800" y="235" width="260" height="154" rx="7" fill="white" stroke="#cbd6dc"/><path d="M807,235 H1053 Q1060,235 1060,242 V282 H800 V242 Q800,235 807,235" fill="#173d4b"/><text x="818" y="265" font-family="sans-serif" font-size="19" font-weight="700" fill="white">iot:reading:500501</text><text x="818" y="311" font-family="sans-serif" font-size="16" fill="#29434d">id, sensor_id, ts</text><text x="818" y="341" font-family="sans-serif" font-size="16" fill="#29434d">temperature_centi</text><text x="818" y="371" font-family="sans-serif" font-size="16" fill="#29434d">humidity_centi</text><path d="M200 330 V224" fill="none" stroke="#5b7a89" stroke-width="2" marker-end="url(#arrow)"/><path d="M355 180 H420" fill="none" stroke="#5b7a89" stroke-width="2" marker-end="url(#arrow)"/><path d="M730 210 H765 V275 H800" fill="none" stroke="#5b7a89" stroke-width="2" marker-end="url(#arrow)"/><path d="M730 425 H765 V375 H800" fill="none" stroke="#5b7a89" stroke-width="2" marker-end="url(#arrow)"/><text x="45" y="560" font-family="sans-serif" font-size="15" fill="#29434d">Lua mantém hash e índices em uma operação atômica. Instância única, sem TTL ou expulsão automática.</text></svg>